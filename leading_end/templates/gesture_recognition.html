<style>

    .layui-body > .container {
        padding: 0;
        max-width: none;
        height: calc(100vh - 60px - 44px);
        display: flex;
    }

    /* 左右两栏 */
    .gesture-left {
        width: 50%;

        display: flex;
        flex-direction: column;
        border-right: 1px solid #e6e6e6;
        background: #fff;
    }
    .gesture-right {

        height: 100%;

        background: #fff;

        width: 100% !important;
        height: 100% !important;
    }

        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: rgba(255,255,255,0.5);
        font-size: 14px;
        z-index: 1;
    }

    .translate-header {
        padding: 14px 20px;
        font-size: 16px;
        font-weight: 600;
        color: #333;
        border-bottom: 1px solid #e6e6e6;
        background: #f8f8f8;

        display: flex;

        margin-right: 6px;

        align-items: center;

    .mapping-row {
        display: flex;

        padding: 3px 4px;

        gap: 6px;

        flex: 1;
        padding: 4px 8px;
        border: 1px solid rgba(100, 140, 255, 0.3);
        border-radius: 4px;

        color: #adf;
        cursor: pointer;
        font-size: 11px;

        background: rgba(60, 80, 140, 0.7);

</style>

<!-- Three.js 3D 模型渲染 + MPU6050 姿态驱动 -->
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==================== Madgwick 姿态融合滤波器 ====================
class MadgwickFilter {
    constructor(beta = 0.1, sampleFreq = 10) {
        this.beta = beta;           // 算法增益
        this.sampleFreq = sampleFreq;
        this.q0 = 1; this.q1 = 0; this.q2 = 0; this.q3 = 0;
    }

    update(ax, ay, az, gx, gy, gz) {
        let q0 = this.q0, q1 = this.q1, q2 = this.q2, q3 = this.q3;
        const halfT = 0.5 / this.sampleFreq;

        // 加速度计归一化
        let norm = Math.sqrt(ax * ax + ay * ay + az * az);
        if (norm < 0.001) {
            // 仅用陀螺仪积分
            q0 += (-q1 * gx - q2 * gy - q3 * gz) * halfT;
            q1 += (q0 * gx + q2 * gz - q3 * gy) * halfT;
            q2 += (q0 * gy - q1 * gz + q3 * gx) * halfT;
            q3 += (q0 * gz + q1 * gy - q2 * gx) * halfT;
        } else {
            ax /= norm; ay /= norm; az /= norm;

            // 梯度下降校正方向
            const _2q0 = 2 * q0, _2q1 = 2 * q1, _2q2 = 2 * q2, _2q3 = 2 * q3;
            const _4q0 = 4 * q0, _4q1 = 4 * q1, _4q2 = 4 * q2;
            const _8q1 = 8 * q1, _8q2 = 8 * q2;
            const q0q0 = q0 * q0, q1q1 = q1 * q1, q2q2 = q2 * q2, q3q3 = q3 * q3;

            let s0 = _4q0 * q2q2 + _2q2 * ax + _4q0 * q1q1 - _2q1 * ay;
            let s1 = _4q1 * q3q3 - _2q3 * ax + 4 * q0q0 * q1 - _2q0 * ay - _4q1 + _8q1 * q1q1 + _8q1 * q2q2 + _4q1 * az;
            let s2 = 4 * q0q0 * q2 + _2q0 * ax + _4q2 * q3q3 - _2q3 * ay - _4q2 + _8q2 * q1q1 + _8q2 * q2q2 + _4q2 * az;
            let s3 = 4 * q1q1 * q3 - _2q1 * ax + 4 * q2q2 * q3 - _2q2 * ay;

            norm = 1 / Math.sqrt(s0 * s0 + s1 * s1 + s2 * s2 + s3 * s3);
            s0 *= norm; s1 *= norm; s2 *= norm; s3 *= norm;

            // 融合: 陀螺仪积分 + 加速度计校正
            const qDot0 = 0.5 * (-q1 * gx - q2 * gy - q3 * gz) - this.beta * s0;
            const qDot1 = 0.5 * (q0 * gx + q2 * gz - q3 * gy) - this.beta * s1;
            const qDot2 = 0.5 * (q0 * gy - q1 * gz + q3 * gx) - this.beta * s2;
            const qDot3 = 0.5 * (q0 * gz + q1 * gy - q2 * gx) - this.beta * s3;

            q0 += qDot0 / this.sampleFreq;
            q1 += qDot1 / this.sampleFreq;
            q2 += qDot2 / this.sampleFreq;
            q3 += qDot3 / this.sampleFreq;
        }

        // 归一化四元数
        const nq = 1 / Math.sqrt(q0 * q0 + q1 * q1 + q2 * q2 + q3 * q3);
        this.q0 = q0 * nq;
        this.q1 = q1 * nq;
        this.q2 = q2 * nq;
        this.q3 = q3 * nq;
    }

    getQuaternion() {
        return { w: this.q0, x: this.q1, y: this.q2, z: this.q3 };
    }

    reset() {
        this.q0 = 1; this.q1 = 0; this.q2 = 0; this.q3 = 0;
    }
}

// ==================== 常量 & 全局状态 ====================
const TOTAL_CHANNELS = 11;
const GYRO_SCALE = 16.4;     // ±2000°/s → 16.4 LSB/(°/s) (与嵌入式 MPU_Set_Gyro_Fsr(3) 匹配)
const ACCEL_SCALE = 16384.0; // ±2g → 16384 LSB/g (与嵌入式 MPU_Set_Accel_Fsr(0) 匹配)
const DEG2RAD = Math.PI / 180;
const POLL_INTERVAL = 50;    // 轮询间隔 ms (提高到 20Hz 减少延迟)
const SENSOR_DATA_RATE = 10;       // 开发板实际发送频率 10Hz
const GYRO_DEADZONE = 1.5;        // 陀螺仪死区阈值 (deg/s)
const ROTATION_DEADZONE = 2.0;    // 四元数输出死区 (度)

// 每个通道一个滤波器
const filters = [];
for (let i = 0; i < TOTAL_CHANNELS; i++) {
    filters.push(new MadgwickFilter(0.1, SENSOR_DATA_RATE));
}

// 四元数插值目标 (用于帧间平滑)
const targetQuats = [];
const currentQuats = [];
for (let i = 0; i < TOTAL_CHANNELS; i++) {
    targetQuats.push(new THREE.Quaternion());
    currentQuats.push(new THREE.Quaternion());
}

// 通道 → 骨骼名映射
let channelBoneMap = {};     // { "ch0": "BoneName", ... }
let bonesByName = {};        // { "BoneName": Bone }
let boneInitQuats = {};      // 骨骼初始四元数 { "BoneName": Quaternion }
let lastDataTime = 0;
let lastDataId = -1;

// 反向映射表: 骨骼名 → {channel}，用于层级旋转时查找父骨骼对应的通道
let boneToChan = {};
function rebuildBoneToChan() {
    boneToChan = {};
    for (let i = 0; i < TOTAL_CHANNELS; i++) {
        const boneName = channelBoneMap['ch' + i];
        if (boneName) boneToChan[boneName] = i;
    }
}

// 参考四元数：记录每个通道的初始传感器姿态，用于计算相对旋转
const refQuats = [];
const refQuatCaptured = [];
const REF_CAPTURE_DELAY = 50; // 收到多少帧数据后捕获参考姿态
const refFrameCount = [];
for (let i = 0; i < TOTAL_CHANNELS; i++) {
    refQuats.push(new THREE.Quaternion());
    refQuatCaptured.push(false);
    refFrameCount.push(0);
}

// ==================== Three.js 场景初始化 ====================
const container = document.getElementById('modelArea');
const loadingEl = document.getElementById('modelLoading');

function getSize() {
    return { w: container.clientWidth || 800, h: container.clientHeight || 600 };
}
const sz = getSize();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(45, sz.w / sz.h, 0.01, 1000);
camera.position.set(0, 0, 1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(sz.w, sz.h);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

// 灯光
scene.add(new THREE.AmbientLight(0xccddff, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
scene.add(dirLight);
scene.add(new THREE.DirectionalLight(0xaabbff, 1.0).translateX(-5).translateY(5).translateZ(-5));
scene.add(new THREE.DirectionalLight(0xffeedd, 0.6).translateY(3).translateZ(-8));
scene.add(new THREE.DirectionalLight(0x8899aa, 0.3).translateY(-5));

// ==================== 骨骼可视化 (动态更新) ====================
let boneGroup = null;
let boneVizData = [];  // [{bone, sphere, cylinder?}]
const jointGeo = new THREE.SphereGeometry(0.012, 16, 16);
const jointMat = new THREE.MeshStandardMaterial({
    color: 0x00ccff, emissive: 0x005566, metalness: 0.6, roughness: 0.3
});
const boneCylMat = new THREE.MeshStandardMaterial({
    color: 0x4488ff, emissive: 0x112244, metalness: 0.5, roughness: 0.4
});

function rebuildBoneViz(bones) {
    if (boneGroup) scene.remove(boneGroup);
    boneGroup = new THREE.Group();
    boneVizData = [];

    bones.forEach(function(bone) {
        const sphere = new THREE.Mesh(jointGeo, jointMat);
        sphere.castShadow = true;
        boneGroup.add(sphere);

        let cyl = null;
        if (bone.parent && bone.parent.isBone) {
            const cylGeo = new THREE.CylinderGeometry(0.005, 0.005, 1, 8);
            cyl = new THREE.Mesh(cylGeo, boneCylMat);
            cyl.castShadow = true;
            boneGroup.add(cyl);
        }
        boneVizData.push({ bone, sphere, cyl });
    });

    scene.add(boneGroup);
    updateBoneViz();
}

function updateBoneViz() {
    const pos = new THREE.Vector3();
    const pPos = new THREE.Vector3();
    const dir = new THREE.Vector3();
    const mid = new THREE.Vector3();
    const up = new THREE.Vector3(0, 1, 0);

    boneVizData.forEach(function(item) {
        item.bone.updateWorldMatrix(true, false);
        pos.setFromMatrixPosition(item.bone.matrixWorld);
        item.sphere.position.copy(pos);

        if (item.cyl && item.bone.parent) {
            item.bone.parent.updateWorldMatrix(true, false);
            pPos.setFromMatrixPosition(item.bone.parent.matrixWorld);
            dir.subVectors(pos, pPos);
            const len = dir.length();
            if (len > 0.001) {
                item.cyl.visible = true;
                item.cyl.scale.set(1, len, 1);
                mid.addVectors(pPos, pos).multiplyScalar(0.5);
                item.cyl.position.copy(mid);
                item.cyl.quaternion.setFromUnitVectors(up, dir.clone().normalize());
            } else {
                item.cyl.visible = false;
            }
        }
    });
}

// ==================== 加载 GLB 模型 ====================
const loader = new GLTFLoader();
const modelUrl = "{{ url_for('static', filename='models/hand_set.glb') }}";

loader.load(
    modelUrl,
    function(gltf) {
        const model = gltf.scene;
        scene.add(model);

        const box = new THREE.Box3();
        const bones = [];

        model.traverse(function(child) {
            if (child.isMesh || child.isSkinnedMesh) {
                child.updateWorldMatrix(true, false);
                const geo = child.geometry;
                if (geo) {
                    geo.computeBoundingBox();
                    const meshBox = geo.boundingBox.clone();
                    meshBox.applyMatrix4(child.matrixWorld);
                    box.union(meshBox);
                }
                if (child.material) {
                    const mats = Array.isArray(child.material) ? child.material : [child.material];
                    mats.forEach(function(mat) {
                        mat.transparent = true;
                        mat.opacity = 0.45;
                        mat.depthWrite = false;
                    });
                }
            }
            if (child.isBone) {
                child.updateWorldMatrix(true, false);
                bones.push(child);
                const pos = new THREE.Vector3();
                pos.setFromMatrixPosition(child.matrixWorld);
                box.expandByPoint(pos);
            }
        });

        // 构建骨骼名称索引 & 记录初始四元数
        bones.forEach(function(bone) {
            bonesByName[bone.name] = bone;
            boneInitQuats[bone.name] = bone.quaternion.clone();
        });

        // 骨骼可视化
        rebuildBoneViz(bones);

        window.handModel = model;
        window.handBones = bones;

        // 设置相机
        const center = new THREE.Vector3();
        let maxDim = 1;
        if (!box.isEmpty()) {
            box.getCenter(center);
            const size = box.getSize(new THREE.Vector3());
            maxDim = Math.max(size.x, size.y, size.z);
        }
        controls.target.copy(center);
        camera.position.set(center.x, center.y + maxDim * 1.2, center.z + maxDim * 0.6);
        camera.lookAt(center);
        controls.update();
        camera.near = 0.001;
        camera.far = maxDim * 100;
        camera.updateProjectionMatrix();

        loadingEl.style.display = 'none';

        // 初始化映射面板 & 开始轮询
        initMappingPanel(bones);
        startPolling();

        console.log('骨骼列表:', bones.map(b => b.name));
    },
    function(xhr) {
        if (xhr.total > 0) {
            const pct = Math.round(xhr.loaded / xhr.total * 100);
            loadingEl.textContent = '模型加载中... ' + pct + '%';
        }
    },
    function(error) {
        loadingEl.textContent = '模型加载失败';
        console.error('GLB load error:', error);
    }
);

// ==================== 通道-骨骼映射面板 ====================
function initMappingPanel(bones) {
    const panel = document.getElementById('mappingPanel');
    const body = document.getElementById('mappingBody');
    const toggle = document.getElementById('mappingToggle');
    const arrow = document.getElementById('mappingArrow');

    panel.style.display = '';

    // 折叠/展开
    let collapsed = false;
    toggle.addEventListener('click', function() {
        collapsed = !collapsed;
        body.classList.toggle('collapsed', collapsed);
        arrow.textContent = collapsed ? '▶' : '▼';
    });

    const boneNames = bones.map(b => b.name);

    // 从 localStorage 加载已保存的映射
    let savedMap = {};
    try {
        const s = localStorage.getItem('imu_bone_mapping');
        if (s) savedMap = JSON.parse(s);
    } catch(e) {}

    // 构建映射行
    let html = '';
    for (let i = 0; i < TOTAL_CHANNELS; i++) {
        const chKey = 'ch' + i;
        const saved = savedMap[chKey] || '';
        html += '<div class="mapping-row">';
        html += '<label>' + chKey + '</label>';
        html += '<select data-ch="' + chKey + '">';
        html += '<option value="">-- 未绑定 --</option>';
        boneNames.forEach(function(name) {
            const sel = (name === saved) ? ' selected' : '';
            html += '<option value="' + name + '"' + sel + '>' + name + '</option>';
        });
        html += '</select>';
        html += '</div>';
    }

    html += '<div class="mapping-actions">';
    html += '<button id="btnSaveMapping">保存映射</button>';
    html += '<button id="btnResetFilters">重置滤波器</button>';
    html += '</div>';

    body.innerHTML = html;

    // 应用已保存的映射
    applyMapping(savedMap);

    // 下拉变化时实时应用
    body.querySelectorAll('select').forEach(function(sel) {
        sel.addEventListener('change', function() {
            readAndApplyMapping();
        });
    });

    // 保存按钮
    document.getElementById('btnSaveMapping').addEventListener('click', function() {
        const map = readAndApplyMapping();
        localStorage.setItem('imu_bone_mapping', JSON.stringify(map));
        console.log('映射已保存:', map);
    });

    // 重置滤波器和校准
    document.getElementById('btnResetFilters').addEventListener('click', function() {
        for (let i = 0; i < TOTAL_CHANNELS; i++) {
            filters[i].reset();
            targetQuats[i].identity();
            // 重置参考四元数，等待重新捕获
            refQuats[i].identity();
            refQuatCaptured[i] = false;
            refFrameCount[i] = 0;
        }
        lastDataId = -1;
        // 重置骨骼到初始姿态
        Object.keys(boneInitQuats).forEach(function(name) {
            if (bonesByName[name]) {
                bonesByName[name].quaternion.copy(boneInitQuats[name]);
            }
        });
        console.log('滤波器和校准已重置');
    });
}

function readAndApplyMapping() {
    const body = document.getElementById('mappingBody');
    const map = {};
    body.querySelectorAll('select').forEach(function(sel) {
        const ch = sel.getAttribute('data-ch');
        if (sel.value) map[ch] = sel.value;
    });
    applyMapping(map);
    return map;
}

function applyMapping(map) {
    channelBoneMap = map;
    rebuildBoneToChan();
}

// ==================== 传感器数据轮询 ====================
function startPolling() {
    setInterval(pollSensorData, POLL_INTERVAL);
}

async function pollSensorData() {
    try {
        const resp = await fetch('/api/device/latest');
        if (!resp.ok) return;
        const json = await resp.json();
        if (json.code !== 0 || !json.data) return;

        const data = json.data;

        // 跳过重复帧
        if (data.id === lastDataId) return;
        lastDataId = data.id;
        lastDataTime = Date.now();

        // 更新连接状态
        if (window.setGloveConnected) window.setGloveConnected(true);

        // 处理左手数据 (11 通道)
        const hand = data.left || data;
        for (let i = 0; i < TOTAL_CHANNELS; i++) {
            const chKey = 'ch' + i;
            const ch = hand[chKey];
            if (!ch) continue;

            // 原始值 → 物理值
            const ax = ch.ax / ACCEL_SCALE;
            const ay = ch.ay / ACCEL_SCALE;
            const az = ch.az / ACCEL_SCALE;
            // 陀螺仪原始值转 deg/s
            let gxDeg = ch.gx / GYRO_SCALE;
            let gyDeg = ch.gy / GYRO_SCALE;
            let gzDeg = ch.gz / GYRO_SCALE;
            // 死区滤波：静止时陀螺仪噪声归零，防止骨骼漂移
            const gyroMag = Math.sqrt(gxDeg * gxDeg + gyDeg * gyDeg + gzDeg * gzDeg);
            if (gyroMag < GYRO_DEADZONE) {
                gxDeg = 0; gyDeg = 0; gzDeg = 0;
            }

            filters[i].update(ax, ay, az, gxDeg * DEG2RAD, gyDeg * DEG2RAD, gzDeg * DEG2RAD);

            // 累计帧数，达到阈值后自动捕获参考四元数
            refFrameCount[i]++;
            if (!refQuatCaptured[i] && refFrameCount[i] >= REF_CAPTURE_DELAY) {
                const rq = filters[i].getQuaternion();
                refQuats[i].set(rq.x, rq.y, rq.z, rq.w);
                refQuatCaptured[i] = true;
            }
        }

        // 更新目标四元数 (不直接设骨骼，留给 animate 做插值)
        updateTargetQuaternions();

    } catch (e) {
        // 网络错误静默处理
    }
}

function updateTargetQuaternions() {
    const initQuat = new THREE.Quaternion(), sensorQuat = new THREE.Quaternion();
    const refInv = new THREE.Quaternion(), deltaQuat = new THREE.Quaternion();
    const parentDelta = new THREE.Quaternion(), parentDeltaInv = new THREE.Quaternion();
    const childRelative = new THREE.Quaternion();
    const deadRad = ROTATION_DEADZONE * DEG2RAD;

    // 第一步：计算所有通道的校准后四元数
    const calibratedDeltas = [];
    for (let i = 0; i < TOTAL_CHANNELS; i++) {
        const boneName = channelBoneMap['ch' + i];
        if (!boneName || !refQuatCaptured[i]) {
            calibratedDeltas.push(null);
            continue;
        }
        const q = filters[i].getQuaternion();
        sensorQuat.set(q.x, q.y, q.z, q.w);
        // 计算相对旋转: deltaQuat = refQuat⁻¹ × sensorQuat
        refInv.copy(refQuats[i]).invert();
        deltaQuat.copy(refInv).multiply(sensorQuat);
        // 旋转角度死区
        const angle = 2 * Math.acos(Math.min(1, Math.abs(deltaQuat.w)));
        if (angle < deadRad) {
            deltaQuat.set(0, 0, 0, 1);
        }
        calibratedDeltas.push(deltaQuat.clone());
    }

    // 第二步：应用层级旋转模式（移植自Blender脚本testmodule.py的层级模式）
    for (let i = 0; i < TOTAL_CHANNELS; i++) {
        const boneName = channelBoneMap['ch' + i];
        if (!boneName || !calibratedDeltas[i]) continue;

        let finalDelta = calibratedDeltas[i];

        // 层级模式：检查该骨骼的父骨骼是否也被传感器驱动
        const bone = bonesByName[boneName];
        if (bone && bone.parent && bone.parent.isBone) {
            const parentChannel = boneToChan[bone.parent.name];
            if (parentChannel !== undefined && calibratedDeltas[parentChannel]) {
                // 父骨骼也被驱动 → 计算相对旋转
                // childRelative = parentDelta⁻¹ × childDelta
                parentDelta.copy(calibratedDeltas[parentChannel]);
                parentDeltaInv.copy(parentDelta).invert();
                childRelative.copy(parentDeltaInv).multiply(calibratedDeltas[i]);
                finalDelta = childRelative;
            }
        }

        if (boneInitQuats[boneName]) {
            initQuat.copy(boneInitQuats[boneName]);
            targetQuats[i].copy(initQuat).multiply(finalDelta);
        } else {
            targetQuats[i].copy(finalDelta);
        }
    }
}

// 在渲染帧中做 SLERP 插值，让骨骼平滑过渡到目标姿态
function interpolateBones() {
    const LERP_FACTOR = 0.15; // 与real_time_translate保持一致

    for (let i = 0; i < TOTAL_CHANNELS; i++) {
        const chKey = 'ch' + i;
        const boneName = channelBoneMap[chKey];
        if (!boneName) continue;
        // 参考姿态未捕获前不驱动骨骼
        if (!refQuatCaptured[i]) continue;

        const bone = bonesByName[boneName];
        if (!bone) continue;

        // SLERP 从当前姿态插值到目标姿态
        bone.quaternion.slerp(targetQuats[i], LERP_FACTOR);
    }
}

// ==================== 连接超时检测 ====================
setInterval(function() {
    if (lastDataTime > 0 && (Date.now() - lastDataTime) > 3000) {
        if (window.setGloveConnected) window.setGloveConnected(false);
    }
}, 1000);

// ==================== 自适应 & 渲染循环 ====================
function onResize() {
    const w = container.clientWidth;
    const h = container.clientHeight;
    if (w > 0 && h > 0) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    }
}
window.addEventListener('resize', onResize);
new ResizeObserver(onResize).observe(container);

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    // 每帧: 插值骨骼姿态 → 更新可视化位置
    interpolateBones();
    if (boneVizData.length > 0) updateBoneViz();
    renderer.render(scene, camera);
}
animate();
</script>

<!-- Layui 按钮事件 & 翻译记录 -->
<script>
layui.use(['layer'], function() {
    var layer = layui.layer;

    // ========== 翻译记录管理 ==========
    var recordCount = 0;

    window.addTranslateRecord = function(gesture) {
        var list = document.getElementById('translateList');
        if (recordCount === 0) {
            list.innerHTML = '';
        }
        var now = new Date();
        var time = now.toLocaleTimeString('zh-CN', {hour12: false});
        var item = document.createElement('div');
        item.className = 'translate-item';
        item.innerHTML = '<span class="translate-time">' + time + '</span>' +
                         '<span class="translate-content">' + gesture + '</span>';
        list.appendChild(item);
        list.scrollTop = list.scrollHeight;
        recordCount++;
        document.getElementById('translateCount').textContent = '共 ' + recordCount + ' 条记录';
    };

    window.setGloveConnected = function(connected) {
        var dot = document.getElementById('statusDot');
        var text = document.getElementById('statusText');
        if (connected) {
            dot.className = 'status-dot online';
            text.textContent = '已连接';
        } else {
            dot.className = 'status-dot';
            text.textContent = '未连接';
        }
    };

});
</script>
