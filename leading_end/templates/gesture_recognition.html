<script type="importmap">
{

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==================== Madgwick 姿态融合滤波器（数值稳定版 v3）====================
// 与 real_time_translate.html 保持一致
class MadgwickFilter {
    constructor(beta = 0.04) {
        this.beta = beta;
        this.q0 = 1; this.q1 = 0; this.q2 = 0; this.q3 = 0;
    }

    update(ax, ay, az, gx, gy, gz, dt) {
        if (!isFinite(dt) || dt <= 0 || dt > 1.0) dt = 0.1;
        const EPS = 1e-6;
        const prevQ0 = this.q0, prevQ1 = this.q1, prevQ2 = this.q2, prevQ3 = this.q3;
        let q0 = prevQ0, q1 = prevQ1, q2 = prevQ2, q3 = prevQ3;
        const halfT = 0.5 * dt;
        const accNorm = Math.sqrt(ax * ax + ay * ay + az * az);

        if (accNorm > EPS) {
            ax /= accNorm; ay /= accNorm; az /= accNorm;
            const _2q0 = 2*q0, _2q1 = 2*q1, _2q2 = 2*q2, _2q3 = 2*q3;
            const _4q0 = 4*q0, _4q1 = 4*q1, _4q2 = 4*q2;
            const _8q1 = 8*q1, _8q2 = 8*q2;
            const q0q0 = q0*q0, q1q1 = q1*q1, q2q2 = q2*q2, q3q3 = q3*q3;

            let s0 = _4q0*q2q2 + _2q2*ax + _4q0*q1q1 - _2q1*ay;
            let s1 = _4q1*q3q3 - _2q3*ax + 4*q0q0*q1 - _2q0*ay - _4q1 + _8q1*q1q1 + _8q1*q2q2 + _4q1*az;
            let s2 = 4*q0q0*q2 + _2q0*ax + _4q2*q3q3 - _2q3*ay - _4q2 + _8q2*q1q1 + _8q2*q2q2 + _4q2*az;
            let s3 = 4*q1q1*q3 - _2q1*ax + 4*q2q2*q3 - _2q2*ay;

            const gradNorm = Math.sqrt(s0*s0 + s1*s1 + s2*s2 + s3*s3);
            let qDot0, qDot1, qDot2, qDot3;
            if (isFinite(gradNorm) && gradNorm > EPS) {
                s0 /= gradNorm; s1 /= gradNorm; s2 /= gradNorm; s3 /= gradNorm;
                qDot0 = 0.5*(-q1*gx - q2*gy - q3*gz) - this.beta*s0;
                qDot1 = 0.5*(q0*gx + q2*gz - q3*gy) - this.beta*s1;
                qDot2 = 0.5*(q0*gy - q1*gz + q3*gx) - this.beta*s2;
                qDot3 = 0.5*(q0*gz + q1*gy - q2*gx) - this.beta*s3;
            } else {
                qDot0 = 0.5*(-q1*gx - q2*gy - q3*gz);
                qDot1 = 0.5*(q0*gx + q2*gz - q3*gy);
                qDot2 = 0.5*(q0*gy - q1*gz + q3*gx);
                qDot3 = 0.5*(q0*gz + q1*gy - q2*gx);
            }
            q0 += qDot0 * dt; q1 += qDot1 * dt; q2 += qDot2 * dt; q3 += qDot3 * dt;
        } else {
            const gDot0 = 0.5*(-q1*gx - q2*gy - q3*gz);
            const gDot1 = 0.5*(q0*gx + q2*gz - q3*gy);
            const gDot2 = 0.5*(q0*gy - q1*gz + q3*gx);
            const gDot3 = 0.5*(q0*gz + q1*gy - q2*gx);
            q0 += gDot0 * dt; q1 += gDot1 * dt; q2 += gDot2 * dt; q3 += gDot3 * dt;
        }

        const qNorm = Math.sqrt(q0*q0 + q1*q1 + q2*q2 + q3*q3);
        if (isFinite(qNorm) && qNorm > EPS) {
            q0 /= qNorm; q1 /= qNorm; q2 /= qNorm; q3 /= qNorm;
        } else {
            q0 = prevQ0; q1 = prevQ1; q2 = prevQ2; q3 = prevQ3;
        }

        if (!isFinite(q0) || !isFinite(q1) || !isFinite(q2) || !isFinite(q3)) {
            this.q0 = prevQ0; this.q1 = prevQ1; this.q2 = prevQ2; this.q3 = prevQ3;
        } else {
            this.q0 = q0; this.q1 = q1; this.q2 = q2; this.q3 = q3;
        }
    }

    getQuaternion() { return { w: this.q0, x: this.q1, y: this.q2, z: this.q3 }; }
    reset() { this.q0 = 1; this.q1 = 0; this.q2 = 0; this.q3 = 0; }
    isValid() {
        return isFinite(this.q0) && isFinite(this.q1) && isFinite(this.q2) && isFinite(this.q3)
            && Math.abs(this.q0*this.q0 + this.q1*this.q1 + this.q2*this.q2 + this.q3*this.q3 - 1) < 0.1;
    }
    getNorm() {
        return Math.sqrt(this.q0*this.q0 + this.q1*this.q1 + this.q2*this.q2 + this.q3*this.q3);
    }
}

// ==================== 常量 ====================
const TOTAL_CHANNELS = 11;
const GYRO_SCALE = 16.4;
const ACCEL_SCALE = 16384.0;
const GYRO_SCALE_ICM = 65.5;
const ACCEL_SCALE_ICM = 8192.0;
const DEG2RAD = Math.PI / 180;
const POLL_INTERVAL = 50;
const GYRO_DEADZONE_DEG = 1.5;
const ROTATION_DEADZONE_RAD = 0.8 * Math.PI / 180;
const MAX_DT = 0.5;
const MIN_DT = 0.02;
const STABILITY_GYRO_THRESH_DEG = 1.0;
// 兼容安装后存在比例/偏置误差的传感器；静止判断仍同时要求低角速度。
const STABILITY_ACCEL_TOL = 0.25;
const CALIB_STABLE_FRAMES = 15;
const KEYFRAME_DELAY_MS = 3000;
const BIAS_BOOT_FRAMES = 30;
const BIAS_BOOT_MAX_GYRO = 5.0;
const CALIB_MIN_FRAMES = 10;
const BIAS_ALPHA = 0.002;

// ==================== 每通道安装坐标修正（单设备）====================
const CHANNEL_CORRECTION = {};
for (let i = 0; i < TOTAL_CHANNELS; i++) {
    CHANNEL_CORRECTION['ch' + i] = {
        axisSwap: [0, 1, 2],
        flip: [1, 1, 1],
        mountQuat: { x: 0, y: 0, z: 0, w: 1 }
    };
}

// 一、坐标修正：加速度计和陀螺仪使用相同变换
function applyChannelCorrection(ax, ay, az, gx, gy, gz, ch) {
    const corr = CHANNEL_CORRECTION['ch' + ch];
    if (!corr) return { ax, ay, az, gx, gy, gz };
    const swap = corr.axisSwap;
    const flip = corr.flip;
    const rawAccel = [ax, ay, az];
    const rawGyro = [gx, gy, gz];
    const ca = [rawAccel[swap[0]] * flip[0], rawAccel[swap[1]] * flip[1], rawAccel[swap[2]] * flip[2]];
    const cg = [rawGyro[swap[0]] * flip[0], rawGyro[swap[1]] * flip[1], rawGyro[swap[2]] * flip[2]];
    const mq = corr.mountQuat;
    if (Math.abs(mq.w) < 0.9999) {
        const mQuat = new THREE.Quaternion(mq.x, mq.y, mq.z, mq.w);
        const vA = new THREE.Vector3(ca[0], ca[1], ca[2]);
        const vG = new THREE.Vector3(cg[0], cg[1], cg[2]);
        vA.applyQuaternion(mQuat);
        vG.applyQuaternion(mQuat);
        return { ax: vA.x, ay: vA.y, az: vA.z, gx: vG.x, gy: vG.y, gz: vG.z };
    }
    return { ax: ca[0], ay: ca[1], az: ca[2], gx: cg[0], gy: cg[1], gz: cg[2] };
}

// ==================== 状态 ====================
const filters = [];
const targetQuats = [];
let lastDeviceTs = null;
let lastUpdateTime = 0;
let lastDataId = -1;
let pollInFlight = false;
let deviceCalibDone = false;
let deviceCalibGeneration = -1;
let currentDeviceGeneration = 0;
let currentSessionKey = '';
let calibrationCaptureAt = Date.now() + KEYFRAME_DELAY_MS;

for (let i = 0; i < TOTAL_CHANNELS; i++) {
    filters.push(new MadgwickFilter(0.04));
    targetQuats.push(new THREE.Quaternion());
}

let channelBoneMap = {};
let bonesByName = {};
let boneInitQuats = {};
let boneParentMap = {};
let boneToChan = {};

function rebuildBoneToChan() {
    boneToChan = {};
    for (let i = 0; i < TOTAL_CHANNELS; i++) {
        const boneName = channelBoneMap['ch' + i];
        if (boneName) boneToChan[boneName] = i;
    }
}

// ==================== 校准状态 ====================
const refQuats = [];
const refQuatCaptured = [];
const refStableCount = [];
const calibratedQuats = [];
const gyroBias = [];
const gyroBiasSamples = [];
const gyroBiasReady = [];
const DEVICE_TIMESTAMP_FIELDS = ['timestamp_ms', 'recv_timestamp_ms'];

for (let i = 0; i < TOTAL_CHANNELS; i++) {
    refQuats.push(new THREE.Quaternion());
    refQuatCaptured.push(false);
    refStableCount.push(0);
    calibratedQuats.push(new THREE.Quaternion());
    gyroBias.push({ x: 0, y: 0, z: 0 });
    gyroBiasSamples.push({ x: 0, y: 0, z: 0, count: 0 });
    gyroBiasReady.push(false);
}

// ==================== Three.js 场景初始化 ====================
const container = document.getElementById('modelArea');
const loadingEl = document.getElementById('modelLoading');

function getSize() { return { w: container.clientWidth || 800, h: container.clientHeight || 600 }; }
const sz = getSize();
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(45, sz.w / sz.h, 0.01, 1000);
camera.position.set(0, 0, 1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(sz.w, sz.h);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

scene.add(new THREE.AmbientLight(0xccddff, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
scene.add(dirLight);
scene.add(new THREE.DirectionalLight(0xaabbff, 1.0).translateX(-5).translateY(5).translateZ(-5));
scene.add(new THREE.DirectionalLight(0xffeedd, 0.6).translateY(3).translateZ(-8));
scene.add(new THREE.DirectionalLight(0x8899aa, 0.3).translateY(-5));

// ==================== 骨骼可视化 ====================
let boneGroup = null;
let boneVizData = [];
const jointGeo = new THREE.SphereGeometry(0.012, 16, 16);
const jointMat = new THREE.MeshStandardMaterial({ color: 0x00ccff, emissive: 0x005566, metalness: 0.6, roughness: 0.3 });
const boneCylMat = new THREE.MeshStandardMaterial({ color: 0x4488ff, emissive: 0x112244, metalness: 0.5, roughness: 0.4 });

function rebuildBoneViz(bones) {
    if (boneGroup) scene.remove(boneGroup);
    boneGroup = new THREE.Group();
    boneVizData = [];
    bones.forEach(function(bone) {
        const sphere = new THREE.Mesh(jointGeo, jointMat);
        sphere.castShadow = true;
        boneGroup.add(sphere);
        let cyl = null;
        if (bone.parent && bone.parent.isBone) {
            const cylGeo = new THREE.CylinderGeometry(0.005, 0.005, 1, 8);
            cyl = new THREE.Mesh(cylGeo, boneCylMat);
            cyl.castShadow = true;
            boneGroup.add(cyl);
        }
        boneVizData.push({ bone, sphere, cyl });
    });
    scene.add(boneGroup);
    updateBoneViz();
}

function updateBoneViz() {
    const pos = new THREE.Vector3(), pPos = new THREE.Vector3();
    const dir = new THREE.Vector3(), mid = new THREE.Vector3();
    const up = new THREE.Vector3(0, 1, 0);
    boneVizData.forEach(function(item) {
        item.bone.updateWorldMatrix(true, false);
        pos.setFromMatrixPosition(item.bone.matrixWorld);
        item.sphere.position.copy(pos);
        if (item.cyl && item.bone.parent) {
            item.bone.parent.updateWorldMatrix(true, false);
            pPos.setFromMatrixPosition(item.bone.parent.matrixWorld);
            dir.subVectors(pos, pPos);
            const len = dir.length();
            if (len > 0.001) {
                item.cyl.visible = true;
                item.cyl.scale.set(1, len, 1);
                mid.addVectors(pPos, pos).multiplyScalar(0.5);
                item.cyl.position.copy(mid);
                item.cyl.quaternion.setFromUnitVectors(up, dir.clone().normalize());
            } else { item.cyl.visible = false; }
        }
    });
}

// ==================== 加载 GLB 模型 ====================
const loader = new GLTFLoader();
const modelUrl = "{{ url_for('static', filename='models/hand_set.glb') }}";

loader.load(
    modelUrl,
    function(gltf) {
        const model = gltf.scene;
        scene.add(model);
        const box = new THREE.Box3();
        const bones = [];
        model.traverse(function(child) {
            if (child.isMesh || child.isSkinnedMesh) {
                child.updateWorldMatrix(true, false);
                const geo = child.geometry;
                if (geo) { geo.computeBoundingBox(); const meshBox = geo.boundingBox.clone(); meshBox.applyMatrix4(child.matrixWorld); box.union(meshBox); }
                if (child.material) {
                    const mats = Array.isArray(child.material) ? child.material : [child.material];
                    mats.forEach(function(mat) { mat.transparent = true; mat.opacity = 0.45; mat.depthWrite = false; });
                }
            }
            if (child.isBone) {
                child.updateWorldMatrix(true, false);
                bones.push(child);
                if (child.parent && child.parent.isBone) boneParentMap[child.name] = child.parent.name;
                const pos = new THREE.Vector3(); pos.setFromMatrixPosition(child.matrixWorld); box.expandByPoint(pos);
            }
        });
        bones.forEach(function(bone) {
            bonesByName[bone.name] = bone;
            boneInitQuats[bone.name] = bone.quaternion.clone();
        });
        rebuildBoneViz(bones);
        window.handModel = model; window.handBones = bones;

        console.log('=== 骨骼层级 ===');
        bones.forEach(function(bone) {
            const depth = getBoneDepth(bone);
            console.log('  '.repeat(depth) + bone.name);
        });

        const center = new THREE.Vector3();
        let maxDim = 1;
        if (!box.isEmpty()) { box.getCenter(center); const size = box.getSize(new THREE.Vector3()); maxDim = Math.max(size.x, size.y, size.z); }
        controls.target.copy(center);
        camera.position.set(center.x, center.y + maxDim * 1.2, center.z + maxDim * 0.6);
        camera.lookAt(center); controls.update();
        camera.near = 0.001; camera.far = maxDim * 100; camera.updateProjectionMatrix();

        loadingEl.style.display = 'none';
        initMappingPanel(bones);
        startPolling();
    },
    function(xhr) { if (xhr.total > 0) loadingEl.textContent = '模型加载中... ' + Math.round(xhr.loaded / xhr.total * 100) + '%'; },
    function(error) { loadingEl.textContent = '模型加载失败'; console.error('GLB load error:', error); }
);

function getBoneDepth(bone) {
    let d = 0, p = bone.parent;
    while (p && p.isBone) { d++; p = p.parent; }
    return d;
}

// ==================== 通道-骨骼映射面板 ====================
function initMappingPanel(bones) {
    const panel = document.getElementById('mappingPanel');
    const body = document.getElementById('mappingBody');
    const toggle = document.getElementById('mappingToggle');
    const arrow = document.getElementById('mappingArrow');
    panel.style.display = '';

    let collapsed = false;
    toggle.addEventListener('click', function() {
        collapsed = !collapsed;
        body.classList.toggle('collapsed', collapsed);
        arrow.textContent = collapsed ? '▶' : '▼';
    });

    const boneNames = bones.map(function(b) { return b.name; });
    let savedMap = {};
    try { var s = localStorage.getItem('imu_bone_mapping'); if (s) savedMap = JSON.parse(s); } catch(e) {}

    let html = '';
    for (let i = 0; i < TOTAL_CHANNELS; i++) {
        const chKey = 'ch' + i;
        const saved = savedMap[chKey] || '';
        html += '<div class="mapping-row">';
        html += '<label>' + chKey + '</label>';
        html += '<select data-ch="' + chKey + '">';
        html += '<option value="">-- 未绑定 --</option>';
        boneNames.forEach(function(name) {
            html += '<option value="' + name + '"' + (name === saved ? ' selected' : '') + '>' + name + '</option>';
        });
        html += '</select></div>';
    }
    html += '<div class="mapping-actions">';
    html += '<button id="btnSaveMapping">保存映射</button>';
    html += '<button id="btnResetFilters">重置滤波器</button>';
    html += '</div>';
    body.innerHTML = html;

    applyMapping(savedMap);

    body.querySelectorAll('select').forEach(function(sel) {
        sel.addEventListener('change', function() { readAndApplyMapping(); });
    });

    document.getElementById('btnSaveMapping').addEventListener('click', function() {
        const map = readAndApplyMapping();
        localStorage.setItem('imu_bone_mapping', JSON.stringify(map));
        console.log('映射已保存:', map);
    });

    document.getElementById('btnResetFilters').addEventListener('click', function() {
        resetAllState();
        Object.keys(boneInitQuats).forEach(function(name) {
            if (bonesByName[name]) {
                bonesByName[name].quaternion.copy(boneInitQuats[name]);
                bonesByName[name].updateWorldMatrix(true, false);
            }
        });
        if (window.handModel) window.handModel.updateWorldMatrix(true, false);
        console.log('滤波器和校准已重置');
    });
}

function readAndApplyMapping() {
    const body = document.getElementById('mappingBody');
    const map = {};
    body.querySelectorAll('select').forEach(function(sel) {
        const ch = sel.getAttribute('data-ch');
        if (sel.value) map[ch] = sel.value;
    });
    applyMapping(map);
    return map;
}

function applyMapping(map) {
    channelBoneMap = map;
    rebuildBoneToChan();
}

function resetAllState() {
    for (let i = 0; i < TOTAL_CHANNELS; i++) {
        filters[i].reset();
        targetQuats[i].identity();
        refQuats[i].identity();
        refQuatCaptured[i] = false;
        refStableCount[i] = 0;
        calibratedQuats[i].identity();
        gyroBias[i] = { x: 0, y: 0, z: 0 };
        gyroBiasSamples[i] = { x: 0, y: 0, z: 0, count: 0 };
        gyroBiasReady[i] = false;
    }
    lastDataId = -1;
    lastUpdateTime = 0;
    lastDeviceTs = null;
    pollInFlight = false;
    deviceCalibDone = false;
    deviceCalibGeneration = -1;
    currentDeviceGeneration = 0;
    currentSessionKey = '';
    calibrationCaptureAt = Date.now() + KEYFRAME_DELAY_MS;
}

function resetTrackingForNewSession() {
    const generation = currentDeviceGeneration;
    const sessionKey = currentSessionKey;
    resetAllState();
    currentDeviceGeneration = generation;
    currentSessionKey = sessionKey;
    pollInFlight = true;
}

// 四、生产校准函数（单设备版本，可测试）
function tryCalibrateDeviceFrameSingle(chValid, chStable, captureQuatGetter, nowMs = Date.now()) {
    if (deviceCalibDone) return false;
    if (nowMs < calibrationCaptureAt) return false;
    const requiredChannels = [];
    for (let i = 0; i < TOTAL_CHANNELS; i++) {
        const boneName = channelBoneMap['ch' + i];
        if (boneName && bonesByName[boneName]) requiredChannels.push(i);
    }
    if (requiredChannels.length === 0) return false;
    for (const i of requiredChannels) {
        if (!chValid[i]) return false;
    }
    for (const i of requiredChannels) {
        const rq = captureQuatGetter(i);
        if (!isFinite(rq.w) || !isFinite(rq.x) || !isFinite(rq.y) || !isFinite(rq.z)) return false;
    }
    for (let i = 0; i < TOTAL_CHANNELS; i++) {
        if (!requiredChannels.includes(i)) { refQuatCaptured[i] = false; continue; }
        const rq = captureQuatGetter(i);
        refQuats[i].set(rq.x, rq.y, rq.z, rq.w);
        refQuatCaptured[i] = true;
    }
    deviceCalibDone = true;
    deviceCalibGeneration = currentDeviceGeneration;
    console.log('[整手校准完成]');
    return true;
}

// ==================== 传感器数据轮询 ====================
function startPolling() { setInterval(pollSensorData, POLL_INTERVAL); }

async function pollSensorData() {
    if (pollInFlight) return;
    pollInFlight = true;

    const now = Date.now();
    try {
        const resp = await fetch('/api/device/latest');
        if (!resp.ok) { pollInFlight = false; return; }
        const json = await resp.json();
        if (json.code !== 0 || !json.data) { pollInFlight = false; return; }

        const data = json.data;
        // 三、5 设备重连检测：固件可携带 sessionId/resets 字段
        const newSession = data.transport_session_id ?? data.sessionId ?? data.session_id ?? null;
        const resets = (typeof data.resets === 'number') ? data.resets : null;
        const sessKey = (newSession !== null ? String(newSession) : 'noSession') + ':' +
                        (resets !== null ? String(resets) : 'noResets');
        if (sessKey !== currentSessionKey) {
            currentDeviceGeneration++;
            currentSessionKey = sessKey;
            resetTrackingForNewSession();
        }

        // 三、5 data.id 单调性判断（同代次内）
        const newId = data.id;
        if (newId !== undefined && newId !== null) {
            if (typeof newId === 'number') {
                if (newId <= lastDataId) { pollInFlight = false; return; }
            }
            lastDataId = newId;
        }

        if (window.setGloveConnected) window.setGloveConnected(true);
        lastDataTime = now;

        // 三、2 dt 计算（当前固件/后端未提供设备时间戳，预留接口）
        let dt = 0.1;
        let devTs = null;
        let devTsUsed = false;
        for (let f = 0; f < DEVICE_TIMESTAMP_FIELDS.length; f++) {
            const k = DEVICE_TIMESTAMP_FIELDS[f];
            if (typeof data[k] === 'number' && isFinite(data[k])) {
                devTs = data[k]; devTsUsed = true; break;
            }
        }
        if (devTsUsed) {
            if (lastDeviceTs !== null && isFinite(lastDeviceTs)) {
                dt = (devTs - lastDeviceTs) / 1000.0;
                dt = Math.max(MIN_DT, Math.min(MAX_DT, dt));
            }
            lastDeviceTs = devTs;
        } else {
            if (lastUpdateTime > 0) {
                dt = (now - lastUpdateTime) / 1000.0;
                dt = Math.max(MIN_DT, Math.min(MAX_DT, dt));
            }
        }
        lastUpdateTime = now;

        const hand = data.left || data;

        const chStable = new Array(TOTAL_CHANNELS).fill(false);
        const chValid = new Array(TOTAL_CHANNELS).fill(false);

        for (let i = 0; i < TOTAL_CHANNELS; i++) {
            const chKey = 'ch' + i;
            const ch = hand[chKey];
            if (!ch) continue;

            if (!isFinite(ch.ax) || !isFinite(ch.ay) || !isFinite(ch.az) ||
                !isFinite(ch.gx) || !isFinite(ch.gy) || !isFinite(ch.gz)) continue;
            chValid[i] = true;

            const isICM = (i === 10);
            const gScale = isICM ? GYRO_SCALE_ICM : GYRO_SCALE;
            const aScale = isICM ? ACCEL_SCALE_ICM : ACCEL_SCALE;

            const corrected = applyChannelCorrection(
                ch.ax / aScale, ch.ay / aScale, ch.az / aScale,
                ch.gx / gScale, ch.gy / gScale, ch.gz / gScale,
                i
            );

            let gxDeg = corrected.gx;
            let gyDeg = corrected.gy;
            let gzDeg = corrected.gz;
            const gyroMag = Math.sqrt(gxDeg*gxDeg + gyDeg*gyDeg + gzDeg*gzDeg);
            const accMag = Math.sqrt(corrected.ax**2 + corrected.ay**2 + corrected.az**2);

            // 三、6 启动阶段显式采集零偏（与 real_time_translate.html 逻辑一致）
            if (!gyroBiasReady[i]) {
                if (gyroMag < BIAS_BOOT_MAX_GYRO && Math.abs(accMag - 1.0) < STABILITY_ACCEL_TOL) {
                    gyroBiasSamples[i].x += gxDeg;
                    gyroBiasSamples[i].y += gyDeg;
                    gyroBiasSamples[i].z += gzDeg;
                    gyroBiasSamples[i].count++;
                    if (gyroBiasSamples[i].count >= BIAS_BOOT_FRAMES) {
                        const s = gyroBiasSamples[i];
                        gyroBias[i] = { x: s.x / s.count, y: s.y / s.count, z: s.z / s.count };
                        gyroBiasReady[i] = true;
                        console.log('[零偏启动校准完成] ch' + i,
                            'bias=', JSON.stringify(gyroBias[i]));
                    }
                } else {
                    gyroBiasSamples[i] = { x: 0, y: 0, z: 0, count: 0 };
                }
            }

            const b = gyroBias[i];
            gxDeg -= b.x; gyDeg -= b.y; gzDeg -= b.z;
            const gyroMag2 = Math.sqrt(gxDeg*gxDeg + gyDeg*gyDeg + gzDeg*gzDeg);
            if (gyroMag2 < GYRO_DEADZONE_DEG) { gxDeg = 0; gyDeg = 0; gzDeg = 0; }

            filters[i].update(corrected.ax, corrected.ay, corrected.az, gxDeg * DEG2RAD, gyDeg * DEG2RAD, gzDeg * DEG2RAD, dt);

            chStable[i] = gyroBiasReady[i] && gyroMag2 < STABILITY_GYRO_THRESH_DEG &&
                          Math.abs(accMag - 1.0) < STABILITY_ACCEL_TOL;
            if (chStable[i]) {
                refStableCount[i]++;
            } else {
                refStableCount[i] = 0;
                // 注意：校准完成后保持锁定，不在动作期撤销
            }
        }

        // 四、进入页面/复位后第 3 秒捕获关键参考帧
        tryCalibrateDeviceFrameSingle(chValid, chStable, function(i) {
            return filters[i].getQuaternion();
        });

        // 应用校准
        for (let i = 0; i < TOTAL_CHANNELS; i++) {
            if (!refQuatCaptured[i]) continue;
            const rq = filters[i].getQuaternion();
            if (!isFinite(rq.w)) continue;
            const sensorQ = new THREE.Quaternion(rq.x, rq.y, rq.z, rq.w);
            const inv = new THREE.Quaternion().copy(refQuats[i]).invert();
            calibratedQuats[i].copy(inv).multiply(sensorQ);
            const angle = 2 * Math.acos(Math.min(1, Math.abs(calibratedQuats[i].w)));
            if (angle < ROTATION_DEADZONE_RAD) calibratedQuats[i].set(0, 0, 0, 1);
        }
    } catch (e) {
        console.error('[姿态轮询失败]', e);
    }

    pollInFlight = false;
    updateTargetQuaternions();
}

function updateTargetQuaternions() {
    const initQuat = new THREE.Quaternion();
    const parentDeltaInv = new THREE.Quaternion();
    const childRelative = new THREE.Quaternion();

    for (let i = 0; i < TOTAL_CHANNELS; i++) {
        const boneName = channelBoneMap['ch' + i];
        if (!boneName || !refQuatCaptured[i]) continue;

        let finalDelta = calibratedQuats[i];
        const bone = bonesByName[boneName];

        // 沿父链查找最近的映射祖先
        let ancestorChannel = null;
        if (bone) {
            let p = bone.parent;
            while (p && p.isBone) {
                const pc = boneToChan[p.name];
                if (pc !== undefined && refQuatCaptured[pc]) { ancestorChannel = pc; break; }
                p = p.parent;
            }
        }

        if (ancestorChannel !== null) {
            parentDeltaInv.copy(calibratedQuats[ancestorChannel]).invert();
            childRelative.copy(parentDeltaInv).multiply(calibratedQuats[i]);
            finalDelta = childRelative;
        }

        if (boneInitQuats[boneName]) {
            initQuat.copy(boneInitQuats[boneName]);
            targetQuats[i].copy(initQuat).multiply(finalDelta);
        } else {
            targetQuats[i].copy(finalDelta);
        }
    }
}

function interpolateBones() {
    for (let i = 0; i < TOTAL_CHANNELS; i++) {
        const boneName = channelBoneMap['ch' + i];
        if (!boneName || !refQuatCaptured[i]) continue;
        const bone = bonesByName[boneName];
        if (!bone) continue;
        const angleDiff = 2 * Math.acos(Math.min(1, Math.abs(bone.quaternion.dot(targetQuats[i]))));
        const step = Math.min(1.0, 0.15 + angleDiff * 0.8);
        bone.quaternion.slerp(targetQuats[i], step);
    }
}

// ==================== 连接超时检测 ====================
var lastDataTime = 0;
setInterval(function() {
    if (lastDataTime > 0 && (Date.now() - lastDataTime) > 3000) {
        if (window.setGloveConnected) window.setGloveConnected(false);
    }
}, 1000);

// ==================== 渲染循环 ====================
function onResize() {
    const w = container.clientWidth, h = container.clientHeight;
    if (w > 0 && h > 0) { camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h); }
}
window.addEventListener('resize', onResize);
new ResizeObserver(onResize).observe(container);

// ==================== 七、浏览器自动验证 ====================
// 与 real_time_translate.html 一致

function findMappedAncestor(boneName) {
    const bone = bonesByName[boneName];
    if (!bone) return null;
    let p = bone.parent;
    while (p && p.isBone) {
        const pc = boneToChan[p.name];
        if (pc !== undefined && refQuatCaptured[pc]) return pc;
        p = p.parent;
    }
    return null;
}

function runBoneHierarchyTests() {
    console.log('===== 骨骼层级单元测试（调用生产函数 findMappedAncestor）=====');
    const results = [];
    const savedBonesByName = bonesByName;
    const savedChannelBoneMap = channelBoneMap;
    const savedBoneToChan = boneToChan;
    const savedRefQuatCaptured = refQuatCaptured.slice();

    const testBones = {};
    function makeBone(name, parent) {
        const b = { name: name, parent: parent, isBone: true };
        testBones[name] = b; return b;
    }
    const handR = makeBone('HandR', null);
    const fingerA1R = makeBone('FingerA1R', handR);
    const fingerA2R = makeBone('FingerA2R', fingerA1R);
    const fingerA3R = makeBone('FingerA3R', fingerA2R);
    makeBone('HandL', null);

    const testMap = {
        'ch0': 'HandR', 'ch2': 'FingerA2R', 'ch3': 'FingerA3R'
    };

    bonesByName = testBones;
    channelBoneMap = testMap;
    boneToChan = {};
    for (let i = 0; i < TOTAL_CHANNELS; i++) {
        const name = testMap['ch' + i];
        if (name) boneToChan[name] = i;
        refQuatCaptured[i] = !!testMap['ch' + i];
    }

    function assert(desc, cond) {
        results.push({ desc: desc, pass: !!cond });
        console.log((cond ? '  [PASS]' : '  [FAIL]') + ' ' + desc);
    }

    const ancA2 = findMappedAncestor('FingerA2R');
    assert('FingerA2R 找到 HandR (ch0)', ancA2 === 0);

    const ancA3 = findMappedAncestor('FingerA3R');
    assert('FingerA3R 找到 FingerA2R (ch2)', ancA3 === 2);

    assert('HandR 无祖先（根骨骼）', findMappedAncestor('HandR') === null);
    assert('HandL 无祖先', findMappedAncestor('HandL') === null);
    assert('FingerA1R 无祖先（自身不在映射）', findMappedAncestor('FingerA1R') === null);

    refQuatCaptured[2] = false;
    const ancA2b = findMappedAncestor('FingerA2R');
    assert('祖先未校准时仍能找到更上层 HandR', ancA2b === 0);
    refQuatCaptured[2] = true;

    bonesByName = savedBonesByName;
    channelBoneMap = savedChannelBoneMap;
    boneToChan = savedBoneToChan;
    for (let i = 0; i < TOTAL_CHANNELS; i++) refQuatCaptured[i] = savedRefQuatCaptured[i];

    const pass = results.filter(function(r) { return r.pass; }).length;
    const fail = results.filter(function(r) { return !r.pass; }).length;
    console.log('===== 结果: ' + pass + ' 通过 / ' + fail + ' 失败 =====');
    return { pass: pass, fail: fail, results: results };
}

function runMadgwickTests() {
    console.log('===== Madgwick 数值稳定性测试 =====');
    const results = [];
    function assert(desc, cond) {
        results.push({ desc: desc, pass: !!cond });
        console.log((cond ? '  [PASS]' : '  [FAIL]') + ' ' + desc);
    }
    const f = new MadgwickFilter(0.04);
    for (let i = 0; i < 100; i++) f.update(0, 0, 1, 0, 0, 0, 0.1);
    assert('静止时梯度为零不产生 NaN', f.isValid());
    const before = f.getQuaternion();
    f.update(NaN, NaN, NaN, NaN, NaN, NaN, 0.1);
    const after = f.getQuaternion();
    assert('NaN 输入后保留上一帧', f.isValid() && before.w === after.w);
    for (let i = 0; i < 1000; i++) {
        f.update(0.1*Math.cos(i*0.01), 0.1*Math.sin(i*0.01), 1, 0.1, 0.1, 0.05, 0.1);
    }
    assert('长期积分后四元数模长接近 1', Math.abs(f.getNorm() - 1) < 0.01);
    f.update(16, -16, 16, 35, -35, 35, 0.02);
    assert('有限极端输入后四元数仍有效', f.isValid() && Math.abs(f.getNorm() - 1) < 0.01);

    const pass = results.filter(function(r) { return r.pass; }).length;
    const fail = results.filter(function(r) { return !r.pass; }).length;
    console.log('===== 结果: ' + pass + ' 通过 / ' + fail + ' 失败 =====');
    return { pass: pass, fail: fail, results: results };
}

function runCalibrationTests() {
    console.log('===== 校准逻辑测试（调用生产 tryCalibrateDeviceFrameSingle）=====');
    const results = [];
    function assert(desc, cond) {
        results.push({ desc: desc, pass: !!cond });
        console.log((cond ? '  [PASS]' : '  [FAIL]') + ' ' + desc);
    }
    function reset() {
        for (let i = 0; i < TOTAL_CHANNELS; i++) {
            refQuats[i].identity();
            refQuatCaptured[i] = false;
            refStableCount[i] = 0;
            calibratedQuats[i].identity();
        }
        deviceCalibDone = false;
        deviceCalibGeneration = -1;
    }
    const goodQ = { w: 1, x: 0, y: 0, z: 0 };
    const chValid = new Array(TOTAL_CHANNELS).fill(true);
    const savedCaptureAt = calibrationCaptureAt;

    reset(); calibrationCaptureAt = 3000;
    const earlyCaptured = tryCalibrateDeviceFrameSingle(
        chValid, new Array(TOTAL_CHANNELS).fill(true), function() { return goodQ; }, 2999
    );
    assert('第 3 秒前不捕获关键帧', !earlyCaptured && !deviceCalibDone);

    const captured = tryCalibrateDeviceFrameSingle(
        chValid, new Array(TOTAL_CHANNELS).fill(false), function() { return goodQ; }, 3000
    );
    assert('第 3 秒使用当前姿态完成关键帧校准', captured && deviceCalibDone);

    const recaptured = tryCalibrateDeviceFrameSingle(
        chValid, new Array(TOTAL_CHANNELS).fill(false), function() { return goodQ; }, 4000
    );
    assert('关键帧捕获后保持锁定', !recaptured && deviceCalibDone);

    reset(); calibrationCaptureAt = 3000;
    const noChannels = new Array(TOTAL_CHANNELS).fill(false);
    const emptyCaptured = tryCalibrateDeviceFrameSingle(
        noChannels, noChannels, function() { return goodQ; }, 3000
    );
    assert('无有效通道时不完成整手校准', !emptyCaptured && !deviceCalibDone);
    calibrationCaptureAt = savedCaptureAt;

    const pass = results.filter(function(r) { return r.pass; }).length;
    const fail = results.filter(function(r) { return !r.pass; }).length;
    console.log('===== 结果: ' + pass + ' 通过 / ' + fail + ' 失败 =====');
    return { pass: pass, fail: fail, results: results };
}

function runAllTests() {
    console.log('================================================================');
    console.log('                   浏览器自动验证测试');
    console.log('================================================================');
    const r1 = runMadgwickTests();
    console.log('');
    const r2 = runBoneHierarchyTests();
    console.log('');
    const r3 = runCalibrationTests();
    console.log('================================================================');
    const total = r1.pass + r2.pass + r3.pass;
    const totalFail = r1.fail + r2.fail + r3.fail;
    console.log('总计: ' + total + ' 通过 / ' + totalFail + ' 失败');
    console.log('================================================================');
    return { madgwick: r1, bones: r2, calibration: r3 };
}

window.runMadgwickTests = runMadgwickTests;
window.runBoneHierarchyTests = runBoneHierarchyTests;
window.runCalibrationTests = runCalibrationTests;
window.runAllTests = runAllTests;

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    interpolateBones();
    if (boneVizData.length > 0) updateBoneViz();
    renderer.render(scene, camera);
}
animate();
</script>
