{% extends "base.html" %}

{% block title %}实时翻译 - 手套数据采集系统{% endblock %}

{% block extra_css %}
<style>
    .layui-body { overflow: hidden; }
    .layui-body > .container {
        padding: 0;
        max-width: none;
        height: calc(100vh - 60px - 44px);
        display: flex;
    }

    /* 左侧：3D模型区 (2/3) */
    .gesture-left {
        width: 66.6%;
        height: 100%;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #e6e6e6;
        background: #fff;
    }
    /* 右侧：翻译面板 (1/3) */
    .gesture-right {
        width: 33.4%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #fff;
    }

    .model-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        background: #f8f8f8;
        border-bottom: 1px solid #e6e6e6;
        flex-shrink: 0;
    }
    .model-toolbar label {
        font-size: 13px;
        color: #666;
        white-space: nowrap;
    }
    .model-toolbar select {
        height: 30px;
        line-height: 30px;
        border: 1px solid #d2d2d2;
        border-radius: 2px;
        padding: 0 8px;
        font-size: 13px;
        min-width: 160px;
        background: #fff;
    }
    .model-toolbar .layui-btn {
        height: 30px;
        line-height: 30px;
        padding: 0 12px;
        font-size: 13px;
    }
    .model-toolbar .model-info {
        font-size: 12px;
        color: #999;
        margin-left: auto;
    }

    .model-area {
        flex: 1;
        background: #1a1a2e;
        position: relative;
        overflow: hidden;
    }
    .model-area canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100% !important;
        height: 100% !important;
    }
    .model-loading {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        color: rgba(255,255,255,0.5);
        font-size: 14px;
        z-index: 1;
    }

    .translate-header {
        padding: 14px 20px;
        font-size: 16px;
        font-weight: 600;
        color: #333;
        border-bottom: 1px solid #e6e6e6;
        background: #f8f8f8;
        flex-shrink: 0;
    }
    .translate-list {
        flex: 1;
        overflow-y: auto;
        padding: 0;
    }
    .translate-item {
        display: flex;
        align-items: flex-start;
        padding: 12px 20px;
        border-bottom: 1px solid #f0f0f0;
    }
    .translate-item:hover { background: #f9f9ff; }
    .translate-time {
        color: #999;
        font-size: 13px;
        white-space: nowrap;
        margin-right: 16px;
        min-width: 70px;
        line-height: 24px;
    }
    .translate-content {
        font-size: 15px;
        color: #333;
        line-height: 24px;
        word-break: break-all;
    }
    .translate-status {
        padding: 10px 20px;
        font-size: 13px;
        color: #999;
        border-top: 1px solid #e6e6e6;
        background: #f8f8f8;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .status-dot {
        display: inline-block;
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #ccc;
        margin-right: 6px;
    }
    .status-dot.online { background: #5fb878; }
</style>
{% endblock %}

{% block content %}
<!-- 左侧：3D骨骼模型 (2/3 宽度) -->
<div class="gesture-left">
    <div class="model-toolbar">
        <label>骨骼模型：</label>
        <select id="modelSelect"><option value="hand_set.glb">hand_set.glb（默认）</option></select>
        <button class="layui-btn layui-btn-sm layui-btn-normal" id="uploadModelBtn">
            <i class="layui-icon layui-icon-upload"></i> 上传模型
        </button>
        <button class="layui-btn layui-btn-sm layui-btn-danger" id="deleteModelBtn" style="display:none;">
            <i class="layui-icon layui-icon-delete"></i> 删除
        </button>
        <input type="file" id="modelFileInput" accept=".glb,.gltf" style="display:none;">
        <span class="model-info" id="modelInfo"></span>
    </div>
    <div class="model-area" id="modelArea">
        <div class="model-loading" id="modelLoading">模型加载中...</div>
    </div>
</div>

<!-- 右侧：实时翻译 (1/3 宽度) -->
<div class="gesture-right">
    <div class="translate-header">
        <i class="layui-icon layui-icon-read"></i> 实时翻译
    </div>
    <div class="translate-list" id="translateList">
        <div style="text-align:center; color:#ccc; padding:60px 0;">等待手套连接...</div>
    </div>
    <div class="translate-status">
        <span style="display:flex; align-items:center; gap:14px;">
            <span title="左手开发板"><span class="status-dot" id="statusDotLeft"></span> 左手: <span id="statusTextLeft">未连接</span></span>
            <span title="右手开发板"><span class="status-dot" id="statusDotRight"></span> 右手: <span id="statusTextRight">未连接</span></span>
        </span>
        <span style="display:flex; align-items:center; gap:12px;">
            <span id="translateCount">共 0 条记录</span>
            <button class="layui-btn layui-btn-sm layui-btn-normal" id="resetGestureBtn">
                <i class="layui-icon layui-icon-refresh"></i> 复位手势
            </button>
        </span>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script type="importmap">
{
    "imports": {
        "three": "{{ url_for('static', filename='js/three/three.module.min.js') }}",
        "three/addons/": "{{ url_for('static', filename='js/three/addons/') }}"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==================== Madgwick 姿态融合滤波器 ====================
class MadgwickFilter {
    constructor(beta = 0.1, sampleFreq = 10) {
        this.beta = beta;
        this.sampleFreq = sampleFreq;
        this.q0 = 1; this.q1 = 0; this.q2 = 0; this.q3 = 0;
    }

    update(ax, ay, az, gx, gy, gz) {
        let q0 = this.q0, q1 = this.q1, q2 = this.q2, q3 = this.q3;
        const halfT = 0.5 / this.sampleFreq;

        let norm = Math.sqrt(ax * ax + ay * ay + az * az);
        if (norm < 0.001) {
            q0 += (-q1 * gx - q2 * gy - q3 * gz) * halfT;
            q1 += (q0 * gx + q2 * gz - q3 * gy) * halfT;
            q2 += (q0 * gy - q1 * gz + q3 * gx) * halfT;
            q3 += (q0 * gz + q1 * gy - q2 * gx) * halfT;
        } else {
            ax /= norm; ay /= norm; az /= norm;
            const _2q0 = 2*q0, _2q1 = 2*q1, _2q2 = 2*q2, _2q3 = 2*q3;
            const _4q0 = 4*q0, _4q1 = 4*q1, _4q2 = 4*q2;
            const _8q1 = 8*q1, _8q2 = 8*q2;
            const q0q0 = q0*q0, q1q1 = q1*q1, q2q2 = q2*q2, q3q3 = q3*q3;

            let s0 = _4q0*q2q2 + _2q2*ax + _4q0*q1q1 - _2q1*ay;
            let s1 = _4q1*q3q3 - _2q3*ax + 4*q0q0*q1 - _2q0*ay - _4q1 + _8q1*q1q1 + _8q1*q2q2 + _4q1*az;
            let s2 = 4*q0q0*q2 + _2q0*ax + _4q2*q3q3 - _2q3*ay - _4q2 + _8q2*q1q1 + _8q2*q2q2 + _4q2*az;
            let s3 = 4*q1q1*q3 - _2q1*ax + 4*q2q2*q3 - _2q2*ay;

            norm = 1 / Math.sqrt(s0*s0 + s1*s1 + s2*s2 + s3*s3);
            s0 *= norm; s1 *= norm; s2 *= norm; s3 *= norm;

            const qDot0 = 0.5*(-q1*gx - q2*gy - q3*gz) - this.beta*s0;
            const qDot1 = 0.5*(q0*gx + q2*gz - q3*gy) - this.beta*s1;
            const qDot2 = 0.5*(q0*gy - q1*gz + q3*gx) - this.beta*s2;
            const qDot3 = 0.5*(q0*gz + q1*gy - q2*gx) - this.beta*s3;

            q0 += qDot0 / this.sampleFreq;
            q1 += qDot1 / this.sampleFreq;
            q2 += qDot2 / this.sampleFreq;
            q3 += qDot3 / this.sampleFreq;
        }
        const nq = 1 / Math.sqrt(q0*q0 + q1*q1 + q2*q2 + q3*q3);
        this.q0 = q0*nq; this.q1 = q1*nq; this.q2 = q2*nq; this.q3 = q3*nq;
    }

    getQuaternion() { return { w: this.q0, x: this.q1, y: this.q2, z: this.q3 }; }
    reset() { this.q0 = 1; this.q1 = 0; this.q2 = 0; this.q3 = 0; }
}

// ==================== 常量 & 状态 ====================
const TOTAL_CHANNELS = 11;
const DEVICES = ['left', 'right'];
const GYRO_SCALE = 16.4;
const ACCEL_SCALE = 16384.0;
const DEG2RAD = Math.PI / 180;
const POLL_INTERVAL = 50;
const SENSOR_DATA_RATE = 10;       // 开发板实际发送频率 10Hz
const GYRO_DEADZONE = 1.5;        // 陀螺仪死区阈值 (deg/s)，静止时噪声低于此值视为零
const ROTATION_DEADZONE = 2.0;    // 四元数输出死区 (度)，相对旋转角度低于此值视为未旋转

// 每只手各 11 个滤波器和目标四元数
const filters = {};
const targetQuats = {};
DEVICES.forEach(function(dev) {
    filters[dev] = [];
    targetQuats[dev] = [];
    for (let i = 0; i < TOTAL_CHANNELS; i++) {
        filters[dev].push(new MadgwickFilter(0.1, SENSOR_DATA_RATE));
        targetQuats[dev].push(new THREE.Quaternion());
    }
});

let channelBoneMap = { left: {}, right: {} };
let bonesByName = {};
let boneInitQuats = {};
let lastDataTime = 0;
let lastDataId = { left: -1, right: -1 };

// 反向映射表: 骨骼名 → {dev, channel}，用于层级旋转时查找父骨骼对应的通道
let boneToChanDev = {};
function rebuildBoneToChanDev() {
    boneToChanDev = {};
    DEVICES.forEach(function(dev) {
        const devMap = channelBoneMap[dev] || {};
        for (let i = 0; i < TOTAL_CHANNELS; i++) {
            const boneName = devMap['ch' + i];
            if (boneName) boneToChanDev[boneName] = { dev: dev, channel: i };
        }
    });
}

// 参考四元数：记录每个通道的初始传感器姿态，用于计算相对旋转
const refQuats = {};
const refQuatCaptured = {};
const REF_CAPTURE_DELAY = 50; // 收到多少帧数据后捕获参考姿态（50帧≈5秒，等滤波器充分收敛）
const refFrameCount = {};
DEVICES.forEach(function(dev) {
    refQuats[dev] = [];
    refQuatCaptured[dev] = [];
    refFrameCount[dev] = [];
    for (let i = 0; i < TOTAL_CHANNELS; i++) {
        refQuats[dev].push(new THREE.Quaternion());
        refQuatCaptured[dev].push(false);
        refFrameCount[dev].push(0);
    }
});

// 从 localStorage 加载映射（通道映射页面保存的）
try {
    const s = localStorage.getItem('imu_bone_mapping');
    if (s) {
        const parsed = JSON.parse(s);
        // 兼容旧格式（无 left/right 层级）
        if (parsed.left || parsed.right) {
            channelBoneMap.left = parsed.left || {};
            channelBoneMap.right = parsed.right || {};
        } else {
            channelBoneMap.left = parsed;
        }
    }
} catch(e) {}
rebuildBoneToChanDev();

// ==================== Three.js 场景 ====================
const container = document.getElementById('modelArea');
const loadingEl = document.getElementById('modelLoading');

const sz = { w: container.clientWidth || 800, h: container.clientHeight || 600 };
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(45, sz.w / sz.h, 0.01, 1000);
camera.position.set(0, 0, 1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(sz.w, sz.h);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

// 灯光
scene.add(new THREE.AmbientLight(0xccddff, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
scene.add(dirLight);
scene.add(new THREE.DirectionalLight(0xaabbff, 1.0).translateX(-5).translateY(5).translateZ(-5));
scene.add(new THREE.DirectionalLight(0xffeedd, 0.6).translateY(3).translateZ(-8));
scene.add(new THREE.DirectionalLight(0x8899aa, 0.3).translateY(-5));

// ==================== 骨骼可视化 ====================
let boneVizData = [];
const jointGeo = new THREE.SphereGeometry(0.012, 16, 16);
const jointMat = new THREE.MeshStandardMaterial({ color: 0x00ccff, emissive: 0x005566, metalness: 0.6, roughness: 0.3 });
const boneCylMat = new THREE.MeshStandardMaterial({ color: 0x4488ff, emissive: 0x112244, metalness: 0.5, roughness: 0.4 });
let boneGroup = null;

function rebuildBoneViz(bones) {
    if (boneGroup) scene.remove(boneGroup);
    boneGroup = new THREE.Group();
    boneVizData = [];
    bones.forEach(function(bone) {
        const sphere = new THREE.Mesh(jointGeo, jointMat);
        sphere.castShadow = true;
        boneGroup.add(sphere);
        let cyl = null;
        if (bone.parent && bone.parent.isBone) {
            const cylGeo = new THREE.CylinderGeometry(0.005, 0.005, 1, 8);
            cyl = new THREE.Mesh(cylGeo, boneCylMat);
            cyl.castShadow = true;
            boneGroup.add(cyl);
        }
        boneVizData.push({ bone, sphere, cyl });
    });
    scene.add(boneGroup);
    updateBoneViz();
}

function updateBoneViz() {
    const pos = new THREE.Vector3(), pPos = new THREE.Vector3();
    const dir = new THREE.Vector3(), mid = new THREE.Vector3();
    const up = new THREE.Vector3(0, 1, 0);
    boneVizData.forEach(function(item) {
        item.bone.updateWorldMatrix(true, false);
        pos.setFromMatrixPosition(item.bone.matrixWorld);
        item.sphere.position.copy(pos);
        if (item.cyl && item.bone.parent) {
            item.bone.parent.updateWorldMatrix(true, false);
            pPos.setFromMatrixPosition(item.bone.parent.matrixWorld);
            dir.subVectors(pos, pPos);
            const len = dir.length();
            if (len > 0.001) {
                item.cyl.visible = true;
                item.cyl.scale.set(1, len, 1);
                mid.addVectors(pPos, pos).multiplyScalar(0.5);
                item.cyl.position.copy(mid);
                item.cyl.quaternion.setFromUnitVectors(up, dir.clone().normalize());
            } else { item.cyl.visible = false; }
        }
    });
}

// ==================== 加载 / 切换模型 ====================
const loader = new GLTFLoader();
let currentModel = null;
let pollingStarted = false;
let currentModelName = 'hand_set.glb';

function loadModel(filename) {
    // 显示加载提示
    loadingEl.style.display = '';
    loadingEl.textContent = '模型加载中...';

    // 清理旧模型
    if (currentModel) {
        scene.remove(currentModel);
        currentModel = null;
    }
    if (boneGroup) {
        scene.remove(boneGroup);
        boneGroup = null;
    }
    boneVizData = [];
    bonesByName = {};
    boneInitQuats = {};
    window.handModel = null;
    window.handBones = null;

    // 重置滤波器（双手）
    DEVICES.forEach(function(dev) {
        for (let i = 0; i < TOTAL_CHANNELS; i++) {
            filters[dev][i].reset();
            targetQuats[dev][i].identity();
            refQuats[dev][i].identity();
            refQuatCaptured[dev][i] = false;
            refFrameCount[dev][i] = 0;
        }
        lastDataId[dev] = -1;
    });

    const modelUrl = '/static/models/' + encodeURIComponent(filename);
    loader.load(
        modelUrl,
        function(gltf) {
            const model = gltf.scene;
            scene.add(model);
            currentModel = model;
            currentModelName = filename;

            const box = new THREE.Box3();
            const bones = [];
            model.traverse(function(child) {
                if (child.isMesh || child.isSkinnedMesh) {
                    child.updateWorldMatrix(true, false);
                    const geo = child.geometry;
                    if (geo) { geo.computeBoundingBox(); const mb = geo.boundingBox.clone(); mb.applyMatrix4(child.matrixWorld); box.union(mb); }
                    if (child.material) {
                        (Array.isArray(child.material) ? child.material : [child.material]).forEach(function(mat) {
                            mat.transparent = true; mat.opacity = 0.45; mat.depthWrite = false;
                        });
                    }
                }
                if (child.isBone) {
                    child.updateWorldMatrix(true, false);
                    bones.push(child);
                    const p = new THREE.Vector3(); p.setFromMatrixPosition(child.matrixWorld); box.expandByPoint(p);
                }
            });
            bones.forEach(function(bone) { bonesByName[bone.name] = bone; boneInitQuats[bone.name] = bone.quaternion.clone(); });
            rebuildBoneViz(bones);
            window.handModel = model; window.handBones = bones;

            const center = new THREE.Vector3();
            let maxDim = 1;
            if (!box.isEmpty()) { box.getCenter(center); const s = box.getSize(new THREE.Vector3()); maxDim = Math.max(s.x, s.y, s.z); }
            controls.target.copy(center);
            camera.position.set(center.x, center.y + maxDim * 1.2, center.z + maxDim * 0.6);
            camera.lookAt(center); controls.update();
            camera.near = 0.001; camera.far = maxDim * 100; camera.updateProjectionMatrix();
            loadingEl.style.display = 'none';

            // 更新模型信息
            document.getElementById('modelInfo').textContent = '骨骼数: ' + bones.length;

            if (!pollingStarted) { pollingStarted = true; startPolling(); }

            // 保存选择到 localStorage
            localStorage.setItem('selected_skeleton_model', filename);
        },
        function(xhr) { if (xhr.total > 0) loadingEl.textContent = '模型加载中... ' + Math.round(xhr.loaded / xhr.total * 100) + '%'; },
        function(error) { loadingEl.textContent = '模型加载失败'; console.error('GLB load error:', error); }
    );
}

// ==================== 模型列表与切换 ====================
const modelSelect = document.getElementById('modelSelect');
const deleteModelBtn = document.getElementById('deleteModelBtn');
const uploadModelBtn = document.getElementById('uploadModelBtn');
const modelFileInput = document.getElementById('modelFileInput');

function refreshModelList(selectName) {
    fetch('/api/models/list').then(r => r.json()).then(function(res) {
        if (res.code !== 0) return;
        modelSelect.innerHTML = '';
        res.data.forEach(function(m) {
            const opt = document.createElement('option');
            opt.value = m.name;
            opt.textContent = m.name + (m.is_default ? '（默认）' : '') +
                ' (' + (m.size / 1024).toFixed(0) + ' KB)';
            modelSelect.appendChild(opt);
        });
        if (selectName) modelSelect.value = selectName;
        updateDeleteBtnVisibility();
    }).catch(function() {});
}

function updateDeleteBtnVisibility() {
    deleteModelBtn.style.display = modelSelect.value === 'hand_set.glb' ? 'none' : '';
}

modelSelect.addEventListener('change', function() {
    updateDeleteBtnVisibility();
    loadModel(modelSelect.value);
});

uploadModelBtn.addEventListener('click', function() { modelFileInput.click(); });

modelFileInput.addEventListener('change', function() {
    const file = modelFileInput.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append('file', file);

    loadingEl.style.display = '';
    loadingEl.textContent = '正在上传模型...';

    fetch('/api/models/upload', { method: 'POST', body: formData })
        .then(r => r.json())
        .then(function(res) {
            if (res.code === 0) {
                refreshModelList(res.data.name);
                loadModel(res.data.name);
                layui.layer.msg('模型上传成功');
            } else {
                loadingEl.style.display = 'none';
                layui.layer.msg(res.msg, { icon: 2 });
            }
        })
        .catch(function() {
            loadingEl.style.display = 'none';
            layui.layer.msg('上传失败', { icon: 2 });
        });
    modelFileInput.value = '';
});

deleteModelBtn.addEventListener('click', function() {
    const name = modelSelect.value;
    if (name === 'hand_set.glb') return;
    layui.layer.confirm('确定删除模型 "' + name + '" 吗？', { icon: 3, title: '确认' }, function(idx) {
        fetch('/api/models/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name })
        }).then(r => r.json()).then(function(res) {
            layui.layer.close(idx);
            if (res.code === 0) {
                layui.layer.msg('删除成功');
                refreshModelList('hand_set.glb');
                loadModel('hand_set.glb');
            } else {
                layui.layer.msg(res.msg, { icon: 2 });
            }
        }).catch(function() { layui.layer.close(idx); layui.layer.msg('删除失败', { icon: 2 }); });
    });
});

// 初始化：加载模型列表并加载上次选择的模型
const savedModel = localStorage.getItem('selected_skeleton_model') || 'hand_set.glb';
refreshModelList(savedModel);
loadModel(savedModel);

// ==================== 传感器轮询 + 姿态驱动 ====================
function startPolling() { setInterval(pollSensorData, POLL_INTERVAL); }

async function pollSensorData() {
    // 同时轮询左右两只手的设备数据
    for (const dev of DEVICES) {
        try {
            const resp = await fetch('/api/device/latest?device=' + dev);
            if (!resp.ok) continue;
            const json = await resp.json();
            if (json.code !== 0 || !json.data) continue;
            const data = json.data;
            if (data.id === lastDataId[dev]) continue;
            lastDataId[dev] = data.id;

            // 设备数据格式: {"device":"left", "left":{"ch0":{ax,ay,...},...}}
            const handData = data[dev];
            if (!handData) continue;

            for (let i = 0; i < TOTAL_CHANNELS; i++) {
                const ch = handData['ch' + i];
                if (!ch) continue;
                // 陀螺仪原始值转 deg/s
                let gxDeg = ch.gx / GYRO_SCALE;
                let gyDeg = ch.gy / GYRO_SCALE;
                let gzDeg = ch.gz / GYRO_SCALE;
                // 死区滤波：静止时陀螺仪噪声归零，防止骨骼漂移
                const gyroMag = Math.sqrt(gxDeg * gxDeg + gyDeg * gyDeg + gzDeg * gzDeg);
                if (gyroMag < GYRO_DEADZONE) {
                    gxDeg = 0; gyDeg = 0; gzDeg = 0;
                }
                filters[dev][i].update(
                    ch.ax / ACCEL_SCALE, ch.ay / ACCEL_SCALE, ch.az / ACCEL_SCALE,
                    gxDeg * DEG2RAD, gyDeg * DEG2RAD, gzDeg * DEG2RAD
                );
                // 累计帧数，达到阈值后自动捕获参考四元数
                refFrameCount[dev][i]++;
                if (!refQuatCaptured[dev][i] && refFrameCount[dev][i] >= REF_CAPTURE_DELAY) {
                    const rq = filters[dev][i].getQuaternion();
                    refQuats[dev][i].set(rq.x, rq.y, rq.z, rq.w);
                    refQuatCaptured[dev][i] = true;
                }
            }
        } catch(e) {}
    }
    updateTargetQuaternions();
}

function updateTargetQuaternions() {
    const initQuat = new THREE.Quaternion(), sensorQuat = new THREE.Quaternion();
    const refInv = new THREE.Quaternion(), deltaQuat = new THREE.Quaternion();
    const parentDelta = new THREE.Quaternion(), parentDeltaInv = new THREE.Quaternion();
    const childRelative = new THREE.Quaternion();
    const deadRad = ROTATION_DEADZONE * DEG2RAD;

    // 第一步：计算所有通道的校准后四元数（deltaQuat）
    const calibratedDeltas = {};
    DEVICES.forEach(function(dev) {
        calibratedDeltas[dev] = [];
        const devMap = channelBoneMap[dev] || {};
        for (let i = 0; i < TOTAL_CHANNELS; i++) {
            if (!devMap['ch' + i] || !refQuatCaptured[dev][i]) {
                calibratedDeltas[dev].push(null);
                continue;
            }
            const q = filters[dev][i].getQuaternion();
            sensorQuat.set(q.x, q.y, q.z, q.w);
            refInv.copy(refQuats[dev][i]).invert();
            deltaQuat.copy(refInv).multiply(sensorQuat);
            // 旋转角度死区
            const angle = 2 * Math.acos(Math.min(1, Math.abs(deltaQuat.w)));
            if (angle < deadRad) {
                deltaQuat.set(0, 0, 0, 1);
            }
            calibratedDeltas[dev].push(deltaQuat.clone());
        }
    });

    // 第二步：应用层级旋转模式（移植自Blender脚本testmodule.py的层级模式）
    DEVICES.forEach(function(dev) {
        const devMap = channelBoneMap[dev] || {};
        for (let i = 0; i < TOTAL_CHANNELS; i++) {
            const boneName = devMap['ch' + i];
            if (!boneName || !calibratedDeltas[dev][i]) continue;

            let finalDelta = calibratedDeltas[dev][i];

            // 层级模式：检查该骨骼的父骨骼是否也被传感器驱动
            const bone = bonesByName[boneName];
            if (bone && bone.parent && bone.parent.isBone) {
                const parentInfo = boneToChanDev[bone.parent.name];
                if (parentInfo && calibratedDeltas[parentInfo.dev] &&
                    calibratedDeltas[parentInfo.dev][parentInfo.channel]) {
                    // 父骨骼也被驱动 → 计算相对旋转
                    // childRelative = parentDelta⁻¹ × childDelta
                    parentDelta.copy(calibratedDeltas[parentInfo.dev][parentInfo.channel]);
                    parentDeltaInv.copy(parentDelta).invert();
                    childRelative.copy(parentDeltaInv).multiply(calibratedDeltas[dev][i]);
                    finalDelta = childRelative;
                }
            }

            if (boneInitQuats[boneName]) {
                initQuat.copy(boneInitQuats[boneName]);
                targetQuats[dev][i].copy(initQuat).multiply(finalDelta);
            } else {
                targetQuats[dev][i].copy(finalDelta);
            }
        }
    });
}

function interpolateBones() {
    DEVICES.forEach(function(dev) {
        const devMap = channelBoneMap[dev] || {};
        for (let i = 0; i < TOTAL_CHANNELS; i++) {
            const boneName = devMap['ch' + i];
            if (!boneName || !bonesByName[boneName]) continue;
            // 参考姿态未捕获前不驱动骨骼，防止被拉向 identity
            if (!refQuatCaptured[dev][i]) continue;
            bonesByName[boneName].quaternion.slerp(targetQuats[dev][i], 0.15);
        }
    });
}

// 双开发板连接状态轮询
let statusCounter = 0;
function pollDeviceStatus() {
    fetch('/api/device/list').then(r => r.json()).then(function(res) {
        if (res.code !== 0) return;
        var onlineIds = (res.data || []).map(function(d) { return d.device; });
        var devInfo = {};
        (res.data || []).forEach(function(d) { devInfo[d.device] = d; });
        ['left', 'right'].forEach(function(dev) {
            var isOnline = onlineIds.indexOf(dev) >= 0;
            var dotEl = document.getElementById('statusDot' + dev.charAt(0).toUpperCase() + dev.slice(1));
            var textEl = document.getElementById('statusText' + dev.charAt(0).toUpperCase() + dev.slice(1));
            if (dotEl) dotEl.className = 'status-dot' + (isOnline ? ' online' : '');
            if (textEl) textEl.textContent = isOnline ? '已连接' + (devInfo[dev] && devInfo[dev].addr ? ' (' + devInfo[dev].addr + ')' : '') : '未连接';
        });
    }).catch(function() {});
}
setInterval(function() {
    statusCounter++;
    if (statusCounter >= 10) {
        statusCounter = 0;
        pollDeviceStatus();
    }
}, POLL_INTERVAL);
pollDeviceStatus();

// ==================== 复位手势 ====================
function resetGesture() {
    // 重置所有 Madgwick 滤波器（双手）
    DEVICES.forEach(function(dev) {
        for (let i = 0; i < TOTAL_CHANNELS; i++) {
            filters[dev][i].reset();
            targetQuats[dev][i].identity();
            // 重置参考四元数，等待重新捕获
            refQuats[dev][i].identity();
            refQuatCaptured[dev][i] = false;
            refFrameCount[dev][i] = 0;
        }
        lastDataId[dev] = -1;
    });
    // 恢复骨骼到初始姿态
    for (const boneName in boneInitQuats) {
        if (bonesByName[boneName]) {
            bonesByName[boneName].quaternion.copy(boneInitQuats[boneName]);
        }
    }
}

document.getElementById('resetGestureBtn').addEventListener('click', resetGesture);

// ==================== 渲染循环 ====================
function onResize() {
    const w = container.clientWidth, h = container.clientHeight;
    if (w > 0 && h > 0) { camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h); }
}
window.addEventListener('resize', onResize);
new ResizeObserver(onResize).observe(container);

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    interpolateBones();
    if (boneVizData.length > 0) updateBoneViz();
    renderer.render(scene, camera);
}
animate();
</script>

<script>
layui.use(['layer'], function() {
    var recordCount = 0;
    window.addTranslateRecord = function(gesture) {
        var list = document.getElementById('translateList');
        if (recordCount === 0) list.innerHTML = '';
        var now = new Date();
        var item = document.createElement('div');
        item.className = 'translate-item';
        item.innerHTML = '<span class="translate-time">' + now.toLocaleTimeString('zh-CN', {hour12: false}) + '</span>' +
                         '<span class="translate-content">' + gesture + '</span>';
        list.appendChild(item);
        list.scrollTop = list.scrollHeight;
        recordCount++;
        document.getElementById('translateCount').textContent = '共 ' + recordCount + ' 条记录';
    };
    // 双开发板状态已通过 module script 中的 pollDeviceStatus 更新
});
</script>
